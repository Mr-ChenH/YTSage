[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ytsage"
version = "5.4.5"
description = "Self-hosted YTSage server with a React-style web interface for yt-dlp downloads."
authors = [
    { name = "oop7", email = "oop7_support@proton.me" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "yt-dlp>=2024.1.0",
    "imageio-ffmpeg>=0.5.1",
    "requests>=2.32.5",
    "packaging>=25.0",
    "loguru>=0.7.3",
    "setuptools>=80.9.0",
]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    'Programming Language :: Python :: 3.14',
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Framework :: FastAPI",
]

keywords = ["youtube", "downloader", "video", "audio", "yt-dlp", "FastAPI", "Docker", "web-ui"]


[project.scripts]
ytsage = "ytsage.server.app:main"

[project.urls]
Homepage = "https://github.com/oop7/YTSage"
Bug-Tracker = "https://github.com/oop7/YTSage/issues"
Reddit = "https://www.reddit.com/r/NO-N_A_M_E/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ytsage*"]

[tool.setuptools.package-data]
ytsage = [
    "server/static/*",
    "server/static/assets/*",
]