name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-pypi:
    uses: ./.github/workflows/build-pypi.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
